name: coomer_downloader
description: "Modern Coomer Content Downloader"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_staggered_grid_view: ^0.7.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  
  # State Management
  provider: ^6.1.1
  
  # Network
  dio: ^5.4.0
  
  # Storage & Downloads
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  
  # Utils
  share_plus: ^7.2.2
  url_launcher: ^6.2.4
  shared_preferences: ^2.2.2
  open_filex: ^4.4.0
  device_info_plus: ^9.1.1
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
